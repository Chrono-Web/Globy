name: Proposta
description: Hai un'idea per Globy? Proponila qui, anche se non è rotto niente
title: "[Proposta] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >
        Grazie! Non serve saper programmare né essere completi: le domande le facciamo
        nei commenti. La guida `docs/PROPORRE.md` spiega cosa scrivere. Se invece
        qualcosa non funziona, usa il modulo «Problema».
  - type: textarea
    id: problem
    attributes:
      label: Bisogno
      description: Cosa ti manca o cosa vorresti fare? Racconta una situazione concreta.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Come te lo immagini
      description: Cosa vedresti o faresti, a parole tue.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative (facoltativo)
      description: Cosa fai oggi al posto di questo, o altre idee che hai considerato.
  - type: dropdown
    id: area
    attributes:
      label: Area prevalente
      options:
        - Non so
        - Prodotto
        - Sincronizzazione
        - Menu bar
        - Mascotte
        - Notifiche
        - Accessibilità
        - Distribuzione
        - Documentazione
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Controllo
      options:
        - label: Ho cercato tra le issue esistenti e non ho trovato la stessa idea.
          required: true
