name: Bug
description: Segnala un comportamento errato e riproducibile di Globy
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Non includere token, dati personali o dettagli di vulnerabilità sfruttabili.
  - type: textarea
    id: observed
    attributes:
      label: Comportamento osservato
      description: Che cosa è successo?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passaggi per riprodurre
      placeholder: |
        1. Avvia…
        2. Seleziona…
        3. Osserva…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione o commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versione macOS e modello Mac
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Note e log non sensibili
