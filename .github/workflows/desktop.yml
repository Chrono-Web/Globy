# Globy per Windows e Linux (cartella desktop/): test del nucleo, build e, sui tag,
# installer allegati alla Release. Il DMG del Mac resta manuale (docs/DISTRIBUZIONE.md).

name: Desktop

on:
  push:
    branches: [ "main", "desktop" ]
    tags: [ "v*" ]
    paths:
      - "desktop/**"
      - "Packages/GlobyCore/Tests/GlobyCoreTests/Fixtures/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Nucleo (globy-core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Test
        # Le fixture sono quelle del pacchetto Swift, lette dal percorso relativo.
        run: cargo test -p globy-core --manifest-path desktop/Cargo.toml

  app:
    name: App ${{ matrix.name }}
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            # La più vecchia supportata: l'AppImage gira sulle distribuzioni più nuove, non il contrario.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: npm ci
      - name: Test dell'app
        run: cargo test -p globy
      - name: Build
        # Con la chiave (secret del repository) la build firma gli installer per gli
        # aggiornamenti automatici; senza, per esempio da un fork, li crea senza firma.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Nomi fissi
        # Gli stessi a ogni versione: il README punta a /releases/latest/download/<nome>.
        run: |
          mkdir -p out
          # Le firme `.sig` seguono il file: la firma è sul contenuto, non sul nome.
          copy() {
            for file in $1; do
              cp "$file" "out/$2"
              if [ -f "$file.sig" ]; then cp "$file.sig" "out/$2.sig"; fi
            done
          }
          if [ "$RUNNER_OS" = "Windows" ]; then
            copy "target/release/bundle/nsis/*-setup.exe" Globy-Windows.exe
          else
            copy "target/release/bundle/appimage/*.AppImage" Globy-Linux.AppImage
            copy "target/release/bundle/deb/*.deb" Globy-Linux.deb
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Globy-${{ matrix.name }}
          path: desktop/out/*
      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Se la Release non c'è ancora la crea in bozza: il DMG del Mac si aggiunge a mano.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Globy ${tag#v}" --notes "In preparazione."
          gh release upload "$tag" out/* --clobber

  feed:
    name: Feed degli aggiornamenti
    # latest.json per il plugin updater: dice a Windows e Linux quale versione esiste e
    # dove scaricarla. Il Mac usa appcast.xml, allegato a mano (docs/DISTRIBUZIONE.md).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ls out/*.sig >/dev/null 2>&1 || { echo "Nessuna firma: manca il secret TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          node desktop/scripts/latest-json.mjs "${tag#v}" \
            "https://github.com/Chrono-Web/GLOBY/releases/download/$tag" \
            windows-x86_64-nsis=out/Globy-Windows.exe \
            linux-x86_64-appimage=out/Globy-Linux.AppImage \
            linux-x86_64-deb=out/Globy-Linux.deb > latest.json
          cat latest.json
          gh release upload "$tag" latest.json --clobber
