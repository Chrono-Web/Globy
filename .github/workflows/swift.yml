# Build e test di Globy: il pacchetto GlobyCore e l'app Xcode.
# Nella radice non c'è un Package.swift: ogni job indica dove lavorare.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  core:
    name: GlobyCore
    # L'app usa API di macOS 26 (Liquid Glass): serve l'SDK di Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test del pacchetto
        run: swift test --package-path Packages/GlobyCore

  app:
    name: App macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Versione di Xcode
        run: xcodebuild -version
      - name: Build e test
        # Senza firma: in CI non ci sono certificati (docs/DISTRIBUZIONE.md).
        run: >
          xcodebuild test
          -project Globy.xcodeproj
          -scheme Globy
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
